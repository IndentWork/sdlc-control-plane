[project]
name = "sdlc-control-plane"
version = "0.1.0"
description = "FastAPI management API — tenant registry, indexing requests, control plane"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "azure-identity>=1.25.3",
    "azure-keyvault-secrets>=4.11.1",
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "sdlc-shared",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[tool.uv.sources]
sdlc-shared = { git = "https://github.com/IndentWork/sdlc-shared.git", rev = "v0.1.0" }
