name: Deploy Control Plane

# Manually triggered — select environment. No version input needed.
# Image tag is derived from the current git SHA — same commit always produces same image.
#
# Flow:
#   1. Compute image tag from branch + short SHA
#   2. If image already exists in ACR → skip build (cheap re-deploy)
#   3. If not → build and push
#   4. Update Container App to use this image
on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - DEV
          - PROD

jobs:
  deploy:
    name: "Deploy → ${{ inputs.env }}"
    runs-on: ubuntu-latest

    # SP credentials looked up dynamically from org-level secrets using uppercase ENV.
    env:
      ARM_CLIENT_ID:       ${{ secrets[format('SDLC_{0}_AZURE_CLIENT_ID_TERRAFORM', inputs.env)] }}
      ARM_CLIENT_SECRET:   ${{ secrets[format('SDLC_{0}_AZURE_CLIENT_SECRET_TERRAFORM', inputs.env)] }}
      ARM_TENANT_ID:       ${{ secrets[format('SDLC_{0}_AZURE_TENANT_ID_TERRAFORM', inputs.env)] }}
      ARM_SUBSCRIPTION_ID: ${{ secrets[format('SDLC_{0}_AZURE_SUBSCRIPTION_ID_TERRAFORM', inputs.env)] }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Convert DEV → dev, get branch name, short SHA for image tagging
      - name: Set build metadata
        run: |
          echo "ENV_LOWER=$(echo '${{ inputs.env }}' | tr '[:upper:]' '[:lower:]')"  >> $GITHUB_ENV
          echo "BRANCH=$(echo '${{ github.ref_name }}')"                              >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)"                   >> $GITHUB_ENV

      # Resource names derived from naming convention
      - name: Set resource names
        run: |
          echo "ACR_NAME=crsdlc${{ env.ENV_LOWER }}"                     >> $GITHUB_ENV
          echo "ACR_SERVER=crsdlc${{ env.ENV_LOWER }}.azurecr.io"        >> $GITHUB_ENV
          echo "CONTAINER_APP=ca-sdlc-base-${{ env.ENV_LOWER }}"         >> $GITHUB_ENV
          echo "RESOURCE_GROUP=rg-sdlc-base-${{ env.ENV_LOWER }}"        >> $GITHUB_ENV

      # Image tag is deterministic from git SHA — same commit → same tag → same image.
      # Redeploying the same commit finds the image already in ACR and skips build.
      - name: Set image tag
        run: |
          BASE="${{ env.ACR_SERVER }}/control-plane"
          TAG="${{ env.BRANCH }}-${{ env.SHORT_SHA }}"
          echo "IMAGE=$BASE:$TAG"      >> $GITHUB_ENV
          echo "IMAGE_TAG=$TAG"        >> $GITHUB_ENV

      - name: Azure Login
        run: |
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID"
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      # Check whether the image for this exact commit already exists in ACR.
      # If yes → skip build and push (fast redeploy path).
      - name: Check if image exists in ACR
        id: check_image
        run: |
          if az acr repository show-tags --name "${{ env.ACR_NAME }}" --repository control-plane 2>/dev/null | grep -q "\"${{ env.IMAGE_TAG }}\""; then
            echo "exists=true"  >> $GITHUB_OUTPUT
            echo "Image ${{ env.IMAGE }} already exists in ACR — skipping build"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Image ${{ env.IMAGE }} not in ACR — will build"
          fi

      - name: Login to Container Registry
        if: steps.check_image.outputs.exists == 'false'
        run: az acr login --name "${{ env.ACR_NAME }}"

      - name: Build Docker image
        if: steps.check_image.outputs.exists == 'false'
        run: docker build -t "${{ env.IMAGE }}" .

      - name: Push Docker image
        if: steps.check_image.outputs.exists == 'false'
        run: docker push "${{ env.IMAGE }}"

      # Always update — even if image existed, we want Container App to restart with it
      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE }}"

      - name: Show deployment info
        run: |
          FQDN=$(az containerapp show \
            --name "${{ env.CONTAINER_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Branch   : ${{ env.BRANCH }}"
          echo "Commit   : ${{ env.SHORT_SHA }}"
          echo "Image    : ${{ env.IMAGE }}"
          echo "Built    : ${{ steps.check_image.outputs.exists == 'false' }}"
          echo "URL      : https://$FQDN"
