name: Deploy Control Plane

# Manually triggered — select environment and provide version before deploying.
# Flow:
#   1. Tag the git repo with the version
#   2. Build Docker image tagged with version + branch + commit SHA
#   3. Push to Azure Container Registry
#   4. Update Container App (triggers restart → migration → FastAPI start)
on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - DEV
          - PROD
      version:
        description: "Version tag (e.g. v0.1.0)"
        required: true
        type: string

jobs:
  deploy:
    name: "Deploy ${{ inputs.version }} → ${{ inputs.env }}"
    runs-on: ubuntu-latest

    # SP credentials looked up dynamically from org-level secrets using uppercase ENV.
    env:
      ARM_CLIENT_ID:       ${{ secrets[format('SDLC_{0}_AZURE_CLIENT_ID_TERRAFORM', inputs.env)] }}
      ARM_CLIENT_SECRET:   ${{ secrets[format('SDLC_{0}_AZURE_CLIENT_SECRET_TERRAFORM', inputs.env)] }}
      ARM_TENANT_ID:       ${{ secrets[format('SDLC_{0}_AZURE_TENANT_ID_TERRAFORM', inputs.env)] }}
      ARM_SUBSCRIPTION_ID: ${{ secrets[format('SDLC_{0}_AZURE_SUBSCRIPTION_ID_TERRAFORM', inputs.env)] }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Convert DEV → dev, get branch name, short SHA for image tagging
      - name: Set build metadata
        run: |
          echo "ENV_LOWER=$(echo '${{ inputs.env }}' | tr '[:upper:]' '[:lower:]')"  >> $GITHUB_ENV
          echo "BRANCH=$(echo '${{ github.ref_name }}')"                              >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)"                   >> $GITHUB_ENV

      # Resource names derived from naming convention
      - name: Set resource names
        run: |
          echo "ACR_NAME=crsdlc${{ env.ENV_LOWER }}"                     >> $GITHUB_ENV
          echo "ACR_SERVER=crsdlc${{ env.ENV_LOWER }}.azurecr.io"        >> $GITHUB_ENV
          echo "CONTAINER_APP=ca-sdlc-base-${{ env.ENV_LOWER }}"         >> $GITHUB_ENV
          echo "RESOURCE_GROUP=rg-sdlc-base-${{ env.ENV_LOWER }}"        >> $GITHUB_ENV

      # Full image tag — version + branch + short SHA so you can identify exactly
      # which version and branch a running container came from.
      # Example: v0.1.0-main-abc1234
      - name: Set image tags
        run: |
          BASE="${{ env.ACR_SERVER }}/control-plane"
          FULL_TAG="${{ inputs.version }}-${{ env.BRANCH }}-${{ env.SHORT_SHA }}"
          echo "IMAGE_FULL=$BASE:$FULL_TAG"          >> $GITHUB_ENV
          echo "IMAGE_VERSION=$BASE:${{ inputs.version }}" >> $GITHUB_ENV
          echo "IMAGE_LATEST=$BASE:latest"            >> $GITHUB_ENV

      # Tag the git repo with the version so the release is traceable in git history.
      # Skips if the tag already exists — safe to re-deploy the same version.
      - name: Create git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag ${{ inputs.version }} already exists — skipping tag creation"
          else
            git tag "${{ inputs.version }}" -m "Release ${{ inputs.version }}"
            git push origin "${{ inputs.version }}"
          fi

      - name: Azure Login
        run: |
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID"
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      - name: Login to Container Registry
        run: az acr login --name "${{ env.ACR_NAME }}"

      # Build with all three tags at once
      - name: Build Docker image
        run: |
          docker build \
            -t "${{ env.IMAGE_FULL }}" \
            -t "${{ env.IMAGE_VERSION }}" \
            -t "${{ env.IMAGE_LATEST }}" \
            .

      - name: Push Docker image
        run: |
          docker push "${{ env.IMAGE_FULL }}"
          docker push "${{ env.IMAGE_VERSION }}"
          docker push "${{ env.IMAGE_LATEST }}"

      # Deploy with the full tag so the container name tells you exactly what is running
      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE_FULL }}"

      - name: Show deployment info
        run: |
          FQDN=$(az containerapp show \
            --name "${{ env.CONTAINER_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Version  : ${{ inputs.version }}"
          echo "Branch   : ${{ env.BRANCH }}"
          echo "Commit   : ${{ env.SHORT_SHA }}"
          echo "Image    : ${{ env.IMAGE_FULL }}"
          echo "URL      : https://$FQDN"
